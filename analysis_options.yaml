# Analysis configuration for OpenCue.
#
# No lint is disabled in order to hide a real problem. The two rules turned
# off below are stylistic choices that conflict with the code style used
# consistently across this repository; both are documented.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat unused code and dead code as build failures rather than warnings.
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    # Enabled: these catch real defects.
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_final_locals: true
    unawaited_futures: true
    unnecessary_await_in_return: true

    # Disabled with reasons:
    # The domain layer is deliberately Flutter-free, so `Key? key`
    # super-parameter widget constructors are used everywhere in lib/features
    # but nowhere else; the rule fires on non-widget constructors too.
    use_super_parameters: false
    # Localized strings live in lib/l10n as plain Dart maps, which this rule
    # misreads as hard-coded UI text.
    prefer_const_constructors_in_immutables: false
