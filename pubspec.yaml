name: opencue
description: >-
  A local, offline library of situationally appropriate conversation openers
  with context-based recommendations.
publish_to: "none"

# Single source of truth for the version is version.txt.
# tool/check_version.dart (run by `flutter test`) enforces that this value,
# lib/core/app_info.dart and installer/opencue.iss all agree.
version: 0.1.0+1

environment:
  # Color.withValues and the PopScope result callback both require the
  # Flutter 3.27 / Dart 3.6 line, so the constraint states that rather than
  # relying on CI happening to install something newer.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # SQLite. sqflite_common_ffi provides the desktop (Windows/macOS/Linux)
  # implementation; sqflite_common provides the shared, platform-independent
  # API surface that the repositories are written against. Adding
  # `sqflite` later gives the identical API on Android with no changes to
  # lib/data/repositories.
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.3

  # Paths and the per-user application data directory.
  path: ^1.9.0
  path_provider: ^2.1.4

  # Native open/save dialogs for JSON export and import.
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample/
